<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<script src="/pea-hub.js?v=20261126" data-app="english" data-name="English Step ฝึกภาษาอังกฤษ"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Step · Level 0</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16213E;--mut:#4A5470;--bg:#F7F8FC;--line:#E3E7F1;--blue:#2F5BEA;--blue2:#1E3FB0;--org:#B85A12;--teal:#0E7C6E;--pur:#6B3FC9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 90px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}
.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--blue);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:12px}
.btn{border:none;background:var(--ink);color:#fff;font-weight:700;padding:0 16px}
.btn.org{background:var(--org)}.btn.pur{background:var(--pur)}.btn.white{background:#fff;color:var(--blue2)}
.soft{border:1px solid #C9D3F2;background:#F1F4FF;color:var(--blue2);font-weight:600;padding:0 14px}
.opt{border:1px solid #C9D3F2;background:#fff;color:var(--ink);font-size:17px}
.opt.ok{border:2px solid var(--teal);background:#D2F0EA;color:#0B5E54;font-weight:700}
.opt.bad{border:2px solid #B42318;background:#F7D6D6;color:#7A1F1F}
.row{display:flex;gap:8px;flex-wrap:wrap}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:var(--ink)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
.big{font-size:32px;font-weight:700;line-height:1.2}
.note{background:#FCE3CC;color:#5E2C05;border-radius:12px;padding:10px 12px;font-size:14px}
.okn{background:#D2F0EA;color:#0B5E54;border-radius:12px;padding:10px 12px;font-size:14px}
.mic{width:80px;height:80px;border-radius:40px;border:none;background:var(--org);color:#fff;display:flex;align-items:center;justify-content:center;align-self:center}
.mic.on{background:#B42318;animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 0 10px}
nav button{border:none;background:none;color:var(--mut);font-size:13px}nav button.on{color:var(--blue2);font-weight:700}
.inp{min-height:48px;border:1px solid #C9D3F2;border-radius:12px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink)}
.inp:focus,button:focus-visible{outline:3px solid #9DB3FF;outline-offset:1px}
label{font-size:14px;font-weight:600}
.stage{display:flex;align-items:center;gap:8px;background:#FBF7F3;border-radius:14px;padding:8px}
.stage svg{width:100%;height:auto;display:block}
.step{padding:6px 10px;border-radius:10px;transition:background .3s}.step.on{background:#FFF1C7}
.yt{display:flex;align-items:center;gap:8px;justify-content:center;min-height:44px;border-radius:12px;border:1px solid #E3B4B4;background:#FFF5F5;color:#8A1C1C;font-weight:600;text-decoration:none}
.rd{display:block;font-size:13px;font-weight:400;color:#993C1D;line-height:1.35}.rx{border-bottom:2px dotted #D85A30}
.tip2{font-size:13px;background:#FAECE7;color:#712B13;border-radius:10px;padding:8px 10px}
.tr{display:block;font-size:12px;font-weight:400;color:#3D63C9;line-height:1.3;margin-top:1px}
.trs{font-size:13px;color:var(--mut);margin-top:2px}
.soft.w2,.opt.w2{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}.sw input{width:22px;height:22px;accent-color:var(--blue)}
.back{border:none;background:none;width:44px;color:var(--ink);padding:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav">
<button data-go="home">หน้าหลัก</button><button data-go="sounds">ออกเสียง</button><button data-go="vocab">คำศัพท์</button><button data-go="tips">เทคนิคจำ</button>
</nav>
<script src="mouth.js"></script>
<script src="data.js?v=20261127"></script>
<script>
const {SOUNDS,DEMO,VOCAB,TH,VTH,TIPS,RD,SRD,SNOTE}=window.ES_DATA;
/* ===== คลังศัพท์ทุกระดับ ===== */
const LEVELS=[{lv:0,name:'ปูพื้นเสียง',cefr:'Pre-A1',goal:150},{lv:1,name:'เอาตัวรอด',cefr:'A1',goal:500},{lv:2,name:'สื่อสารประจำวัน',cefr:'A2',goal:1200},{lv:3,name:'คุยได้คล่อง',cefr:'B1',goal:2500},{lv:4,name:'มั่นใจในที่ทำงาน',cefr:'B2',goal:4000}];
const ALL=[],BYW={},RDALL=Object.assign({},RD);
function addE(e){const w=e.w.toLowerCase();if(BYW[w])return;e.w=w;BYW[w]=e;ALL.push(e);if(e.rd&&!RDALL[w])RDALL[w]=e.rd}
VOCAB.forEach((v,k)=>addE({lv:0,cat:v[0],w:v[1],th:v[2],rd:RD[v[1]]||'',ex:v[3],exth:VTH[k]||'',srd:SRD[k]||'',note:SNOTE[k]||''}));
window.ES_ADD=(lv,cat,txt)=>txt.split('\n').map(s=>s.trim()).filter(Boolean).forEach(line=>{const f=line.split('|').map(x=>x.trim());if(f.length>=5)addE({lv,cat,w:f[0],th:f[1],rd:f[2],ex:f[3],exth:f[4],srd:'',note:f[5]||''})});
const LV_FILES=[0,1,2,3,4],lvLoaded={};let allLoaded=null;
function loadLevel(lv){return lvLoaded[lv]||(lvLoaded[lv]=new Promise(res=>{const s=document.createElement('script');s.src='vocab/l'+lv+'.js?v=20261127';s.onload=res;s.onerror=()=>{lvLoaded[lv]=null;res()};document.head.append(s)}))}
function loadAll(){return allLoaded||(allLoaded=LV_FILES.reduce((p,lv)=>p.then(()=>loadLevel(lv)),Promise.resolve()))}
const inLv=lv=>ALL.filter(e=>e.lv===lv);
const autoRead=ex=>String(ex||'').replace(/[A-Za-z][A-Za-z']*/g,m=>{const k=m.toLowerCase();const r=RDALL[k]||RDALL[k.replace(/'s$|s$|es$|ed$|ing$/,'')];return r?r:m});

/* ================= ล็อกอิน + เก็บข้อมูล ================= */
const API='https://script.google.com/macros/s/AKfycby-QfNUJFz0vCVtD4K0Fk3_k4d-U6pkkdjxjCgk69eRbdohQJPRJjU7zkllpJ2FS9ky/exec';
const AKEY='engstep_auth';let mem={};
function lget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]||null}}
function lset(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ldel(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
let AUTH=lget(AKEY);
const DAY=864e5;
const blank=()=>({cards:{},sounds:{},streak:0,last:'',newToday:0,newDay:'',showTH:true,showRD:true,lv:0,perDay:10});
const dkey=()=>'engstep_l0_'+(AUTH?AUTH.user.username:'guest');
let D=blank();
const packCards=c=>Object.keys(c).map(w=>w+'\t'+c[w].box+'\t'+Math.round(c[w].due/DAY)).join('\n');
const unpackCards=s=>{const c={};String(s||'').split('\n').forEach(l=>{const f=l.split('\t');if(f.length===3)c[f[0]]={box:+f[1],due:+f[2]*DAY}});return c};
function useData(x){x=Object.assign({},x||{});if(x.cz!=null){x.cards=unpackCards(x.cz);delete x.cz}D=Object.assign(blank(),x)}
async function api(action,body){
 const r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({action},body||{}))});
 return r.json()}
let syncT=null;
function save(d){lset(dkey(),d);if(!AUTH)return;clearTimeout(syncT);syncT=setTimeout(push,2500)}
async function push(){if(!AUTH)return;clearTimeout(syncT);syncT=null;
 try{const out=Object.assign({},D,{cards:undefined,cz:packCards(D.cards)});const r=await api('save',{token:AUTH.token,data:out});if(r&&r.auth===false)logout(true)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&syncT)push()});
const INT=[1,3,7,14,30,60];
const today=()=>new Date().toISOString().slice(0,10);
function touch(){const t=today();if(D.last!==t){const y=new Date(Date.now()-DAY).toISOString().slice(0,10);D.streak=D.last===y?D.streak+1:1;D.last=t}save(D)}
function logout(expired){if(AUTH){const t=AUTH.token;if(!expired)api('logout',{token:t}).catch(()=>{})}
 AUTH=null;ldel(AKEY);D=blank();hubLogin()}

/* ================= เสียง ================= */
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en-US/i.test(x.lang)&&/Google|Samantha|Microsoft/i.test(x.name))||v.find(x=>/^en/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate){if(!('speechSynthesis' in window))return alertBox('เครื่องนี้ไม่รองรับเสียงอ่าน');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate||0.9;speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(onDone,onErr){if(!SR){onErr('เครื่องหรือเบราว์เซอร์นี้ยังไม่รองรับการฟังเสียงพูด แนะนำให้เปิดด้วย Chrome');return null}
 const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;
 r.onresult=e=>{const alts=[...e.results[0]].map(a=>({t:a.transcript.toLowerCase().trim(),c:a.confidence}));onDone(alts)};
 r.onerror=e=>onErr(e.error==='not-allowed'?'ใช้ไมโครโฟนไม่ได้: ถ้าเปิดจากหน้าตัวอย่างใน Claude ไมค์จะถูกปิดไว้ ต้องเปิดจากเว็บจริง (GitHub Pages) หรือถ้าเปิดจากเว็บจริงแล้ว ให้กดอนุญาตไมค์ที่เบราว์เซอร์':e.error==='no-speech'?'ไม่ได้ยินเสียง ลองพูดดังขึ้นอีกนิด':'ฟังเสียงไม่สำเร็จ ('+e.error+')');
 try{r.start()}catch(e){onErr('เริ่มไมค์ไม่ได้')}return r}
function judge(alts,target,wrong){target=target.toLowerCase();const w=s=>s.replace(/[^a-z ]/g,'').split(' ');
 const hit=alts.find(a=>w(a.t).join(' ')===target||w(a.t).includes(target));
 if(hit){const sc=Math.round(60+40*(hit===alts[0]?(alts[0].c||0.8):0.5));return{ok:true,score:Math.min(sc,100),heard:alts[0].t}}
 const conf=wrong&&alts.find(a=>w(a.t).includes(wrong.toLowerCase()));return{ok:false,score:conf?30:20,heard:alts[0]?alts[0].t:'',conf:!!conf}}

/* ================= หน้าจอ ================= */
const $=s=>document.querySelector(s),app=$('#app');
const rdHTML=t=>esc(t).replace(/\{([^}]*)\}/g,'<span class="rx">$1</span>');
const rdPlain=t=>String(t||'').replace(/[{}]/g,'');
const rdw=w=>(D.showRD&&RD[w])?`<span class="rd">${rdHTML(RD[w])}</span>`:'';
const soundOf=w=>{let i=SOUNDS.findIndex(x=>x.ex.includes(w));if(i<0)i=SOUNDS.findIndex(x=>x.pairs.some(p=>p[0]===w));if(i<0)i=SOUNDS.findIndex(x=>x.pairs.some(p=>p.includes(w)));return i};
const trw=w=>(D.showTH&&TH[w])?`<span class="tr">${esc(TH[w])}</span>`:'';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIC='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
const BACK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
function alertBox(m){const n=document.createElement('div');n.className='note';n.textContent=m;app.prepend(n);setTimeout(()=>n.remove(),4000)}
function nav(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
function go(v,arg){window.scrollTo(0,0);nav(v==='sound'?'sounds':v==='review'?'vocab':v);({home,sounds,sound,vocab,review,tips}[v])(arg)}

function stats(lv){const ws=lv==null?ALL:inLv(lv);const learned=ws.filter(e=>(D.cards[e.w]||{}).box>=2).length;const seen=ws.filter(e=>D.cards[e.w]).length;
 const due=Object.keys(D.cards).filter(w=>D.cards[w].due<=Date.now()).length;
 const snd=Object.values(D.sounds).filter(s=>s.best>=70).length;return{learned,seen,due,snd}}

function home(){const s=stats(0),sa=stats();const n0=Math.max(inLv(0).length,1);const pct=Math.round(((s.learned/n0)+(s.snd/SOUNDS.length))*50);if(!allReady)loadAll().then(()=>{if(!allReady){allReady=true;if($('#gS'))home()}});
 app.innerHTML=`<div class="row" style="justify-content:space-between;align-items:center"><div><div class="mut">สวัสดี ${esc(AUTH?AUTH.user.name:'')}</div><h1>Level 0 · ปูพื้นเสียง</h1></div><span class="tag" style="background:#FCE3CC;color:#7A3A08">เรียนต่อเนื่อง ${D.streak||0} วัน</span></div>
 <div class="hero"><div style="font-size:14px">ความคืบหน้า Level 0</div><div class="big">${pct}%</div><div class="bar" style="background:rgba(255,255,255,.3)"><i style="width:${pct}%;background:#fff"></i></div>
 <div style="font-size:14px">ผ่านเกณฑ์ Level 0: ออกเสียงได้ ≥70% ครบ ${SOUNDS.length} เสียง และจำศัพท์ได้ครบ ${n0} คำ</div></div>
 <div class="g2"><div class="card"><div class="mut">เสียงที่ผ่านแล้ว</div><div class="big">${s.snd}<span class="mut"> / ${SOUNDS.length}</span></div><button class="btn org" id="gS">ฝึกออกเสียง</button></div>
 <div class="card"><div class="mut">คำที่จำได้ (ทุกระดับ)</div><div class="big">${sa.learned}<span class="mut"> / ${ALL.length}</span></div><button class="btn" id="gV">ทบทวนศัพท์${s.due?' ('+s.due+')':''}</button></div></div>
 <label class="card sw" for="rdsw"><span><b>แสดงคำอ่านภาษาพูด</b><br><span class="mut">อ่านแบบที่เจ้าของภาษาพูดจริง · <span class="rx">เส้นจุด</span> = เสียงที่ภาษาไทยไม่มี</span></span><input type="checkbox" id="rdsw" ${D.showRD?"checked":""}></label>
 <label class="card sw" for="thsw"><span><b>แสดงคำแปลภาษาไทย</b><br><span class="mut">คำแปลตัวเล็กใต้คำอังกฤษ · บัตรคำทบทวนยังซ่อนไว้เสมอ</span></span><input type="checkbox" id="thsw" ${D.showTH?"checked":""}></label>
 <div class="card"><h2>แผนวันนี้ (ประมาณ 15–20 นาที)</h2><div>1. ฝึกออกเสียง 1 เสียง: ฟัง → ทายคู่เสียง → พูด</div><div>2. ทบทวนคำที่ครบรอบ และเรียนคำใหม่ 8 คำ</div><div>3. อ่านเทคนิคจำ 1 เรื่อง แล้วลองใช้จริง</div></div>
 <div class="row" style="justify-content:space-between;align-items:center"><span class="mut">ผลการเรียนบันทึกขึ้นระบบอัตโนมัติ</span><a class="soft" href="/index.html" style="display:flex;align-items:center;text-decoration:none;border-radius:12px">ศูนย์รวมงาน</a></div>`;
 $('#thsw').onchange=e=>{D.showTH=e.target.checked;save(D)};$('#rdsw').onchange=e=>{D.showRD=e.target.checked;save(D)};
 $('#gS').onclick=()=>go('sounds');$('#gV').onclick=()=>go('review')}

function sounds(){app.innerHTML=`<h1>ห้องออกเสียง</h1><div class="mut">${SOUNDS.length} เสียงที่คนไทยมักออกผิด เรียงจากง่ายไปยาก</div>`+
 SOUNDS.map((s,i)=>{const b=(D.sounds[s.id]||{}).best;const t=b>=70?`<span class="tag" style="background:#D2F0EA;color:#0B5E54">ผ่าน ${b}</span>`:b?`<span class="tag" style="background:#FCE3CC;color:#7A3A08">${b}</span>`:'<span class="tag" style="background:#EEF0F5;color:#4A5470">ยังไม่ฝึก</span>';
 return `<button class="item" data-i="${i}"><span><b>${i+1}. ${esc(s.name)}</b><br><span class="mut">${s.ex.join(' · ')}</span></span>${t}</button>`}).join('');
 app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>go('sound',+b.dataset.i))}

function sound(i){const s=SOUNDS[i],dm=DEMO[s.id];let q=null,rec=null;
 app.innerHTML=`<div class="row" style="align-items:center"><button class="back" id="bk" aria-label="กลับ">${BACK}</button><div><div class="mut">เสียงที่ ${i+1} จาก ${SOUNDS.length}</div><h1>${esc(s.name)}</h1></div></div>
 <div class="card"><h2>ดูปากขยับ</h2>
 <div class="stage"><div style="flex:3" id="sv"></div><div style="flex:2" id="fv"></div></div>
 <div class="row" style="justify-content:space-between;align-items:center"><span class="tag" id="cap" style="background:#EEF0F5;color:#16213E">ท่าปกติ</span><span class="mut" id="capw"></span></div>
 <div class="g2"><button class="btn org" id="pl">เล่นพร้อมเสียง</button><button class="soft" id="ps">เล่นช้า</button></div>
 ${dm.cmp?`<button class="soft" id="pc">เทียบ ${esc(dm.cmp[0][1])} กับ ${esc(dm.cmp[1][1])}</button>`:''}
 ${dm.seq?`<button class="soft" id="pq">ดูทีละเสียงในคำ “${esc(dm.w)}”</button>`:''}
 <div class="mut" style="font-size:13px">ภาพซ้าย = มองด้านข้าง · ภาพขวา = มองด้านหน้า · วงเขียว = จุดที่แตะ · ลูกศรน้ำเงิน = ลมออก · คลื่นส้มที่คอ = เสียงก้อง</div></div>
 <div class="card"><h2>วิธีวางปาก</h2>${s.steps.map((t,k)=>`<div class="step" id="st${k}"><b>${k+1}.</b> ${esc(t)}</div>`).join('')}
 <a class="yt" href="https://www.youtube.com/results?search_query=${encodeURIComponent(dm.yt)}" target="_blank" rel="noopener"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>ดูวิดีโอสอนจากครูบน YouTube</a></div>
 <div class="card"><h2>ฟังตัวอย่าง</h2><div class="g2">${s.ex.map(w=>`<button class="soft w2" data-say="${w}"><span>${w}</span>${rdw(w)}${trw(w)}</button>`).join('')}</div><div class="mut">แตะคำเพื่อฟัง แตะค้างฟังช้า</div></div>
 <div class="card"><h2>ทายคู่เสียง</h2><div class="mut">กดฟัง แล้วเลือกคำที่ได้ยิน</div><button class="soft" id="play">ฟังคำปริศนา</button><div class="g2" id="opts"></div><div id="qres"></div></div>
 <div class="card"><h2>พูดให้ระบบฟัง</h2><div class="mut">พูดคำนี้:</div><div><div class="big" id="tw"></div><div class="rd" id="twr" style="font-size:15px"></div><div class="trs" id="twt"></div></div><div class="row"><button class="soft" id="hear">ฟังต้นแบบ</button><button class="soft" id="slow">ฟังช้า</button><button class="soft" id="nx">คำถัดไป</button></div>
 <button class="mic" id="mic" aria-label="กดแล้วพูด">${MIC}</button><div id="sres"></div></div>`;
 $('#bk').onclick=()=>{run++;go('sounds')};
 const MO=window.MOUTH;let cur=MO.REST,run=0;
 const draw=p=>{if(!$('#sv')){run++;return}$('#sv').innerHTML=MO.side(p);$('#fv').innerHTML=MO.front(p.f)};draw(cur);
 const wait=ms=>new Promise(r=>setTimeout(r,ms));
 const hi=k=>s.steps.forEach((_,n)=>{const e=$('#st'+n);if(e)e.classList.toggle('on',n===k)});
 const cap=(t,w)=>{$('#cap').textContent=t;$('#capw').textContent=w?(w+(D.showRD&&RD[w]?' · '+rdPlain(RD[w]):'')+(D.showTH&&TH[w]?' · '+TH[w]:'')):''};
 function move(to,ms,id){const from=cur;return new Promise(res=>{const t0=performance.now();
  const f=now=>{if(id!==run)return res(false);let t=Math.min(1,(now-t0)/ms);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;draw(MO.lerp(from,to,e));
   if(t<1)requestAnimationFrame(f);else{cur=to;res(true)}};requestAnimationFrame(f)})}
 async function playMain(slow){const id=++run,k=slow?1.8:1,P=MO.M[dm.m];
  cap('ท่าปกติ');hi(0);draw(cur=MO.REST);await wait(300*k);
  if(!await move(P,800*k,id))return;cap(P.label,dm.w);hi(1);say(dm.w,slow?0.55:0.85);await wait(1400*k);if(id!==run)return;
  hi(2);await wait(1200*k);if(id!==run)return;if(!await move(MO.REST,600*k,id))return;cap('ท่าปกติ');hi(-1)}
 async function playCmp(){const id=++run;hi(-1);for(const [kk,w] of dm.cmp){const P=MO.M[kk];
  if(!await move(P,700,id))return;cap(P.label,w);say(w,0.8);await wait(1600);if(id!==run)return;
  if(!await move(MO.REST,450,id))return;cap('ท่าปกติ');await wait(350)}}
 async function playSeq(){const id=++run;hi(-1);say(dm.w,0.6);for(const kk of dm.seq){const P=MO.M[kk];
  if(!await move(P,550,id))return;cap(P.label,dm.w);await wait(650);if(id!==run)return}
  await wait(400);if(!await move(MO.REST,500,id))return;cap('ท่าปกติ');say(dm.w,0.85)}
 $('#pl').onclick=()=>playMain(false);$('#ps').onclick=()=>playMain(true);
 if($('#pc'))$('#pc').onclick=playCmp;if($('#pq'))$('#pq').onclick=playSeq;
 app.querySelectorAll('[data-say]').forEach(b=>{let t;b.onpointerdown=()=>{t=setTimeout(()=>{t=0;say(b.dataset.say,0.55)},450)};b.onpointerup=()=>{if(t){clearTimeout(t);say(b.dataset.say)}}});
 function newQ(){const p=s.pairs[Math.floor(Math.random()*s.pairs.length)];const a=Math.random()<.5?0:1;q={p,a};
  $('#opts').innerHTML=p.map((w,k)=>`<button class="opt w2" data-k="${k}"><span>${w}</span>${rdw(w)}${trw(w)}</button>`).join('');$('#qres').innerHTML='';
  $('#opts').querySelectorAll('button').forEach(b=>b.onclick=()=>{const ok=+b.dataset.k===q.a;b.classList.add(ok?'ok':'bad');if(!ok)$('#opts').children[q.a].classList.add('ok');
   $('#qres').innerHTML=`<div class="${ok?'okn':'note'}">${ok?'ถูกต้อง':'คำที่ได้ยินคือ '+q.p[q.a]}</div><button class="soft" id="again">ข้อต่อไป</button>`;$('#again').onclick=()=>{newQ();say(q.p[q.a])}})}
 newQ();$('#play').onclick=()=>say(q.p[q.a]);
 const words=[...s.ex,...s.pairs.map(p=>p[0])].filter((w,k,a)=>a.indexOf(w)===k);let wi=0;
 const pairOf=w=>{const p=s.pairs.find(p=>p.includes(w));return p?p.find(x=>x!==w):null};
 const setW=()=>{$('#tw').textContent=words[wi];$('#twt').textContent=D.showTH?(TH[words[wi]]||''):'';$('#twr').innerHTML=D.showRD&&RD[words[wi]]?rdHTML(RD[words[wi]]):'';$('#sres').innerHTML=''};setW();
 $('#hear').onclick=()=>say(words[wi]);$('#slow').onclick=()=>say(words[wi],0.55);$('#nx').onclick=()=>{wi=(wi+1)%words.length;setW()};
 $('#mic').onclick=()=>{if(rec){rec.stop();return}const m=$('#mic');m.classList.add('on');
  rec=listen(alts=>{m.classList.remove('on');rec=null;const w=words[wi],r=judge(alts,w,pairOf(w));
   const st=D.sounds[s.id]||{best:0,tries:0};st.tries++;st.best=Math.max(st.best,r.score);D.sounds[s.id]=st;touch();
   $('#sres').innerHTML=`<div class="${r.ok?'okn':'note'}"><b>${r.score} คะแนน</b> · ระบบได้ยินว่า “${esc(r.heard||'-')}”<br>${r.ok?'ออกเสียงได้ดี ลองคำถัดไป':r.conf?'ระบบได้ยินเป็นคำคู่เสียง ('+pairOf(w)+') ลองดูวิธีวางปากด้านบนอีกครั้ง':'ยังไม่ตรง ฟังต้นแบบแล้วลองใหม่'}</div>`},
   e=>{m.classList.remove('on');rec=null;$('#sres').innerHTML=`<div class="note">${esc(e)}</div>`})}}

let allReady=false;
function vocab(){if(!allReady){app.innerHTML='<h1>คลังศัพท์</h1><div class="mut">กำลังโหลดคำศัพท์ทุกระดับ…</div>';loadAll().then(()=>{allReady=true;if(app.querySelector('h1')&&app.querySelector('h1').textContent==='คลังศัพท์')vocab()});return}
 const lv=D.lv||0,ws=inLv(lv),s=stats(lv),L=LEVELS[lv],cats=[...new Set(ws.map(e=>e.cat))];
 app.innerHTML=`<h1>คลังศัพท์</h1>
 <div class="row">${LEVELS.map(x=>{const n=inLv(x.lv).length,m=stats(x.lv).learned;return `<button class="soft w2" data-lv="${x.lv}" style="${x.lv===lv?'background:#2F5BEA;color:#fff;border-color:#2F5BEA':''}"><span>Level ${x.lv}</span><span class="tr" style="color:inherit;opacity:.85">${m}/${n}</span></button>`}).join('')}</div>
 <div class="card"><div class="row" style="justify-content:space-between"><b>Level ${lv} · ${L.name} (${L.cefr})</b><span class="mut">${ws.length} คำ · ${cats.length} หมวด</span></div>
 <div class="row" style="justify-content:space-between"><span>จำได้แล้ว <b>${s.learned}</b> / ${ws.length}</span><span class="mut">ครบรอบทบทวน (ทุกระดับ) ${s.due} คำ</span></div><div class="bar"><i style="width:${ws.length?s.learned/ws.length*100:0}%"></i></div>
 <label class="sw" for="pd"><span>คำใหม่ต่อวัน</span><select id="pd" class="inp" style="min-height:40px;width:auto">${[5,10,15,20,30].map(n=>`<option ${n===(D.perDay||10)?'selected':''}>${n}</option>`).join('')}</select></label>
 <button class="btn" id="st">เริ่มทบทวน + คำใหม่ Level ${lv}</button></div>`+
 cats.map((c,ci)=>{const cw=ws.filter(e=>e.cat===c);const n=cw.filter(e=>(D.cards[e.w]||{}).box>=2).length;
  return `<div class="card"><button class="row" data-cat="${ci}" style="justify-content:space-between;align-items:center;border:none;background:none;font:inherit;color:inherit;padding:0;min-height:36px;width:100%;cursor:pointer"><h2>${esc(c)}</h2><span class="mut">${n}/${cw.length} ▾</span></button><div class="row" id="cw${ci}" hidden></div></div>`}).join('')+
 `<div class="mut">แตะชื่อหมวดเพื่อดูคำ · สีเขียว = จำได้แล้ว · สีส้ม = กำลังจำ · สีเทา = ยังไม่เรียน · แตะคำเพื่อฟัง</div>`;
 app.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{D.lv=+b.dataset.lv;save(D);vocab()});
 $('#pd').onchange=e=>{D.perDay=+e.target.value;save(D)};
 app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.cat,box=$('#cw'+ci);if(!box.hidden){box.hidden=true;return}
  if(!box.innerHTML)box.innerHTML=ws.filter(e=>e.cat===cats[ci]).map(e=>{const bx=(D.cards[e.w]||{}).box;const col=bx>=2?'#D2F0EA':bx!==undefined?'#FCE3CC':'#EEF0F5';return `<button class="soft w2" style="background:${col};border:none;color:#16213E" data-say="${esc(e.w)}"><span style="font-weight:600">${esc(e.w)}</span>${D.showRD&&e.rd?`<span class="rd">${rdHTML(e.rd)}</span>`:''}${D.showTH?`<span class="tr">${esc(e.th)}</span>`:''}</button>`}).join('');
  box.hidden=false;box.querySelectorAll('[data-say]').forEach(x=>x.onclick=()=>say(x.dataset.say))});
 $('#st').onclick=()=>go('review')}

function review(){const t=today();if(D.newDay!==t){D.newDay=t;D.newToday=0}
 if(!allReady){app.innerHTML='<div class="mut">กำลังโหลดคำศัพท์…</div>';loadAll().then(()=>{allReady=true;go('review')});return}
 const lv=D.lv||0,per=D.perDay||10;
 const due=Object.keys(D.cards).filter(w=>D.cards[w].due<=Date.now()&&BYW[w]).map(w=>BYW[w]);
 const fresh=inLv(lv).filter(e=>!D.cards[e.w]).slice(0,Math.max(0,per-D.newToday));
 let queue=[...due,...fresh],done=0,total=queue.length;
 if(!total){const left=inLv(lv).filter(e=>!D.cards[e.w]).length;app.innerHTML=`<h1>ทบทวนครบแล้ว</h1><div class="okn">${left?`วันนี้ไม่มีคำค้างทบทวน และเรียนคำใหม่ครบ ${per} คำแล้ว กลับมาพรุ่งนี้นะครับ`:`เรียนคำใน Level ${lv} ครบทุกคำแล้ว ไปที่คลังศัพท์แล้วเลือก Level ถัดไปได้เลย`}</div><button class="btn" id="h">กลับหน้าหลัก</button>`;$('#h').onclick=()=>go('home');return}
 function show(){if(!queue.length){touch();app.innerHTML=`<h1>เสร็จแล้ว</h1><div class="okn">ทบทวนครบ ${total} คำ</div><button class="btn" id="h">กลับหน้าหลัก</button>`;$('#h').onclick=()=>go('home');return}
  const v=queue[0],isNew=!D.cards[v.w];let flipped=false,rec=null;
  app.innerHTML=`<div class="row" style="align-items:center"><button class="back" id="bk" aria-label="กลับ">${BACK}</button><div style="flex:1"><div class="mut">${done}/${total} ${isNew?'· คำใหม่':'· ทบทวน'} · Level ${v.lv} · ${esc(v.cat)}</div><div class="bar"><i style="width:${done/total*100}%"></i></div></div></div>
  <button class="card" id="fc" style="min-height:230px;text-align:left;font:inherit;color:inherit;cursor:pointer"><div class="big">${esc(v.w)}</div><div id="bk2" class="mut">แตะเพื่อดูความหมาย</div></button>
  <div class="row"><button class="soft" id="hear">ฟังเสียง</button><button class="soft" id="slow">ฟังช้า</button><button class="soft" id="spk">ลองพูด</button></div><div id="sres"></div>
  <div class="g3" id="rate" style="visibility:hidden"><button style="border:none;background:#F7D6D6;color:#7A1F1F;font-weight:700" data-r="0">ลืม<br><small>ทวนอีกรอบ</small></button><button style="border:none;background:#FCE3CC;color:#5E2C05;font-weight:700" data-r="1">พอจำได้</button><button style="border:none;background:#D2F0EA;color:#0B5E54;font-weight:700" data-r="2">จำได้ดี</button></div>`;
  say(v.w);$('#bk').onclick=()=>go('vocab');$('#hear').onclick=()=>say(v.w);$('#slow').onclick=()=>say(v.w,0.55);
  $('#fc').onclick=()=>{if(flipped)return;flipped=true;const si=soundOf(v.w),sr=v.srd||autoRead(v.ex);
   $('#bk2').outerHTML=`${D.showRD&&v.rd?`<div class="rd" style="font-size:16px">${rdHTML(v.rd)}</div>`:''}<div style="font-size:22px;font-weight:700">${esc(v.th)}</div><div style="font-weight:600">${esc(v.ex)}</div>${D.showRD&&sr?`<div class="rd" style="font-size:15px">${rdHTML(sr)}</div>`:''}<div class="trs">${esc(v.exth)}</div>${D.showRD&&v.note?`<div class="tip2">ภาษาพูด: ${esc(v.note)}</div>`:''}${si>=0?`<span class="soft" id="toSnd" role="button" tabindex="0" style="display:inline-flex;align-items:center;align-self:flex-start;margin-top:4px">ดูภาพปากเสียงนี้</span>`:''}`;
   const ts=$('#toSnd');if(ts)ts.onclick=e=>{e.stopPropagation();go('sound',si)};$('#rate').style.visibility='visible';say(v.ex,0.85)};
  $('#spk').onclick=()=>{if(rec)return;$('#sres').innerHTML='<div class="mut">กำลังฟัง… พูดได้เลย</div>';rec=listen(a=>{rec=null;const r=judge(a,v.w);$('#sres').innerHTML=`<div class="${r.ok?'okn':'note'}">${r.ok?'พูดถูก':'ระบบได้ยินว่า “'+esc(r.heard||'-')+'” ลองใหม่'}</div>`},e=>{rec=null;$('#sres').innerHTML=`<div class="note">${esc(e)}</div>`})};
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=+b.dataset.r,c=D.cards[v.w]||{box:0};if(isNew)D.newToday++;
   if(r===0){c.box=0;c.due=Date.now();queue.push(queue.shift());D.cards[v.w]=c;save(D);show();return}
   c.box=Math.min(r===2?c.box+1:Math.max(c.box,1),INT.length);c.due=Date.now()+INT[Math.max(c.box-1,0)]*DAY;D.cards[v.w]=c;queue.shift();done++;save(D);show()})}
 show()}

function tips(){app.innerHTML=`<h1>เทคนิคจำศัพท์</h1><div class="mut">อ่านวันละ 1 เรื่อง แล้วลองใช้กับคำศัพท์วันนั้น</div>`+
 TIPS.map((t,i)=>`<div class="card"><h2>${i+1}. ${esc(t[0])}</h2><div>${esc(t[1])}</div></div>`).join('')}

function hubCreds(){try{return{name:localStorage.getItem('pea_aoluek_username')||'',pass:localStorage.getItem('pea_aoluek_password')||''}}catch(e){return{name:'',pass:''}}}
function authBox(msg,err){$('#nav').style.display='none';window.scrollTo(0,0);
 app.innerHTML=`<div style="padding-top:24px"><div class="mut">English Step</div><h1 style="font-size:26px">เข้าสู่ระบบ</h1><div class="mut">ใช้บัญชีเดียวกับศูนย์รวมงาน กฟส.อ่าวลึก</div></div>
 <div class="card"><div class="${err?'note':'mut'}">${esc(msg)}</div>${err?'<button class="btn" id="rt">ลองใหม่</button>':''}<a class="soft" href="/index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">ไปหน้าศูนย์รวมงาน</a></div>`;
 if(err)$('#rt').onclick=hubLogin}
let hubWait=null;
async function hubLogin(){clearTimeout(hubWait);const c=hubCreds();
 if(!c.name||!c.pass){authBox('รอเข้าสู่ระบบศูนย์รวมงาน…');hubWait=setTimeout(hubLogin,1500);return}
 authBox('กำลังตรวจสอบสิทธิ์กับศูนย์รวมงาน…');
 try{const r=await api('hubAuth',{name:c.name,pass:c.pass});
  if(!r.ok){if(r.auth===false){hubWait=setTimeout(hubLogin,3000)}authBox(r.msg||'เข้าสู่ระบบไม่สำเร็จ',true);return}
  AUTH={token:r.token,user:r.user,hubName:c.name};lset(AKEY,AUTH);
  const local=lget(dkey());if(r.data)useData(r.data);else{useData(local);push()}
  lset(dkey(),D);start()}
 catch(e){authBox('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่',true)}}
function start(){$('#nav').style.display='';go('home')}
if(AUTH&&AUTH.hubName&&AUTH.hubName===hubCreds().name){useData(lget(dkey()));start();
 api('load',{token:AUTH.token}).then(r=>{if(r.auth===false)return logout(true);if(r.ok){AUTH.user=r.user;lset(AKEY,AUTH);if(r.data){useData(r.data);lset(dkey(),D)}else push();if(!$('#fc'))go('home')}}).catch(()=>{})}
else{AUTH=null;ldel(AKEY);hubLogin()}
</script>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">

<title>English Step · Level 0</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16213E;--mut:#4A5470;--bg:#F7F8FC;--line:#E3E7F1;--blue:#2F5BEA;--blue2:#1E3FB0;--org:#B85A12;--teal:#0E7C6E;--pur:#6B3FC9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.55}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 90px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0}
.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero{background:var(--blue);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:12px}
.btn{border:none;background:var(--ink);color:#fff;font-weight:700;padding:0 16px}

.opt.bad{border:2px solid #B42318;background:#F7D6D6;color:#7A1F1F}
.row{display:flex;gap:8px;flex-wrap:wrap}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:var(--ink)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--blue)}
.big{font-size:32px;font-weight:700;line-height:1.2}
.note{background:#FCE3CC;color:#5E2C05;border-radius:12px;padding:10px 12px;font-size:14px}
.okn{background:#D2F0EA;color:#0B5E54;border-radius:12px;padding:10px 12px;font-size:14px}
.mic{width:80px;height:80px;border-radius:40px;border:none;background:var(--org);color:#fff;display:flex;align-items:center;justify-content:center;align-self:center}

.inp:focus,button:focus-visible{outline:3px solid #9DB3FF;outline-offset:1px}
label{font-size:14px;font-weight:600}
.stage{display:flex;align-items:center;gap:8px;background:#FBF7F3;border-radius:14px;padding:8px}
.stage svg{width:100%;height:auto;display:block}
.step{padding:6px 10px;border-radius:10px;transition:background .3s}.step.on{background:#FFF1C7}
.yt{display:flex;align-items:center;gap:8px;justify-content:center;min-height:44px;border-radius:12px;border:1px solid #E3B4B4;background:#FFF5F5;color:#8A1C1C;font-weight:600;text-decoration:none}
.rd{display:block;font-size:13px;font-weight:400;color:#993C1D;line-height:1.35}.rx{border-bottom:2px dotted #D85A30}
.tip2{font-size:13px;background:#FAECE7;color:#712B13;border-radius:10px;padding:8px 10px}
.tr{display:block;font-size:12px;font-weight:400;color:#3D63C9;line-height:1.3;margin-top:1px}
.trs{font-size:13px;color:var(--mut);margin-top:2px}
.soft.w2,.opt.w2{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}.sw input{width:22px;height:22px;accent-color:var(--blue)}
.py{display:block;font-size:14px;font-weight:600;color:#6B3FC9;line-height:1.3}
.cjk{font-size:44px;font-weight:600;line-height:1.25}
.lg{border:1px solid #C9D3F2;background:#fff;color:var(--ink);border-radius:999px;min-height:36px;padding:0 14px;font-weight:600}.lg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.back{border:none;background:none;width:44px;color:var(--ink);padding:0}
</style>

<script>
(function(){var L='en';try{L=new URLSearchParams(location.search).get('lang')||localStorage.getItem('langstep_lang')||'en'}catch(e){}
if(!/^(en|zh|ja)$/.test(L))L='en';try{var A=JSON.parse(localStorage.getItem('pea_hub_auth')||'null');if(L!=='en'&&A&&A.role!=='admin'&&Array.isArray(A.apps)&&A.apps.indexOf('lang_'+L)<0){window.LANG_DENIED=L;L='en'}}catch(e){}window.LANG=L;try{localStorage.setItem('langstep_lang',L)}catch(e){}
document.write('<script src="'+(L==='en'?'data.js?v=20261127':L+'/pack.js?v=20261127d')+'"><\/script>')})();

<script>
/* ===== ชุดภาษา ===== */
const LANGS=[{code:'en',label:'English'},{code:'zh',label:'中文 จีน'},{code:'ja',label:'日本語 ญี่ปุ่น'}];
const EN=window.ES_DATA||{};
const LP=LANG==='en'?{code:'en',label:'English',thName:'ภาษาอังกฤษ',tts:'en-US',ttsRe:/en-US/i,SOUNDS:EN.SOUNDS,DEMO:EN.DEMO,TIPS:EN.TIPS,DICT:{},
 levels:[{lv:0,name:'ปูพื้นเสียง',cefr:'Pre-A1',goal:150},{lv:1,name:'เอาตัวรอด',cefr:'A1',goal:500},{lv:2,name:'สื่อสารประจำวัน',cefr:'A2',goal:1200},{lv:3,name:'คุยได้คล่อง',cefr:'B1',goal:2500},{lv:4,name:'มั่นใจในที่ทำงาน',cefr:'B2',goal:4000}],
 lvFile:lv=>'vocab/l'+lv+'.js'}:window.LANGPACK;
const CJK=LANG!=='en';
const {SOUNDS,DEMO,TIPS}=LP;const LEVELS=LP.levels;
const TH=EN.TH||{},RD=EN.RD||{},VTH=EN.VTH||[],SRD=EN.SRD||[],SNOTE=EN.SNOTE||[];
document.title=LP.label+' Step';
/* ===== คลังศัพท์ทุกระดับ ===== */
const ALL=[],BYW={},RDALL=Object.assign({},RD);
function addE(e){const w=CJK?e.w:e.w.toLowerCase();if(BYW[w])return;e.w=w;BYW[w]=e;ALL.push(e);if(e.rd&&!RDALL[w])RDALL[w]=e.rd}
if(!CJK)(EN.VOCAB||[]).forEach((v,k)=>addE({lv:0,cat:v[0],w:v[1],th:v[2],rd:RD[v[1]]||'',ex:v[3],exth:VTH[k]||'',srd:SRD[k]||'',note:SNOTE[k]||''}));
window.ES_ADD=(lv,cat,txt)=>txt.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{const f=line.split('|').map(x=>x.trim());
 if(!CJK){if(f.length>=5)addE({lv,cat,w:f[0],th:f[1],rd:f[2],ex:f[3],exth:f[4],srd:'',note:f[5]||''});return}
 if(f.length<6)return;addE({lv,cat,w:f[0],py:f[1],kana:LP.kana?f[1]:undefined,th:f[2],ex:f[3],expy:f[4],exth:f[5],note:f[6]||'',rd:LP.read(f[1],f[0]),srd:LP.readSentence(f[4],f[3])})});
const LV_FILES=[0,1,2,3,4],lvLoaded={};let allLoaded=null;
function loadLevel(lv){return lvLoaded[lv]||(lvLoaded[lv]=new Promise(res=>{const s=document.createElement('script');s.src=LP.lvFile(lv)+'?v=20261127d';s.onload=res;s.onerror=()=>{lvLoaded[lv]=null;res()};document.head.append(s)}))}
function loadAll(){return allLoaded||(allLoaded=LV_FILES.reduce((p,lv)=>p.then(()=>loadLevel(lv)),Promise.resolve()))}
const inLv=lv=>ALL.filter(e=>e.lv===lv);
const autoRead=ex=>String(ex||'').replace(/[A-Za-z][A-Za-z']*/g,m=>{const k=m.toLowerCase();const r=RDALL[k]||RDALL[k.replace(/'s$|s$|es$|ed$|ing$/,'')];return r?r:m});
// ข้อมูลของคำใดๆ (คลังศัพท์ → คำในบทเรียนเสียง)
function info(w){const e=BYW[CJK?w:String(w).toLowerCase()];if(e)return e;
 if(CJK){const d=(LP.DICT||{})[w];return d?{w,py:d[0],kana:LP.kana?d[0]:undefined,th:d[1],rd:LP.read(d[0],w)}:{w}}return {w,th:TH[w],rd:RD[w]}}

/* ================= ล็อกอิน + เก็บข้อมูล ================= */
const API='https://script.google.com/macros/s/AKfycby-QfNUJFz0vCVtD4K0Fk3_k4d-U6pkkdjxjCgk69eRbdohQJPRJjU7zkllpJ2FS9ky/exec';
const AKEY='engstep_auth';let mem={};
function lget(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return mem[k]||null}}
function lset(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function ldel(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
let AUTH=lget(AKEY);
const DAY=864e5;
const blank=()=>({cards:{},sounds:{},streak:0,last:'',newToday:0,newDay:'',showTH:true,showRD:true,lv:0,perDay:10,L:{}});
// ความคืบหน้าแยกรายภาษา: อังกฤษอยู่ชั้นบนสุด (เข้ากับระบบเดิม) ภาษาอื่นอยู่ใน D.L[รหัสภาษา]
function P(){if(LANG==='en')return D;D.L=D.L||{};return D.L[LANG]||(D.L[LANG]={cards:{},sounds:{},lv:0,perDay:10,newToday:0,newDay:''})}
const dkey=()=>'engstep_l0_'+(AUTH?AUTH.user.username:'guest');
let D=blank();
const packCards=c=>Object.keys(c).map(w=>w+'\t'+c[w].box+'\t'+Math.round(c[w].due/DAY)).join('\n');
const unpackCards=s=>{const c={};String(s||'').split('\n').forEach(l=>{const f=l.split('\t');if(f.length===3)c[f[0]]={box:+f[1],due:+f[2]*DAY}});return c};
function useData(x){x=Object.assign({},x||{});if(x.cz!=null){x.cards=unpackCards(x.cz);delete x.cz}
 const L={};Object.keys(x.L||{}).forEach(k=>{const o=Object.assign({},x.L[k]);if(o.cz!=null){o.cards=unpackCards(o.cz);delete o.cz}o.cards=o.cards||{};o.sounds=o.sounds||{};L[k]=o});x.L=L;D=Object.assign(blank(),x)}
async function api(action,body){
 const r=await fetch(API,{method:'POST',body:JSON.stringify(Object.assign({action},body||{}))});
 return r.json()}
let syncT=null;
function save(d){lset(dkey(),d);if(!AUTH)return;clearTimeout(syncT);syncT=setTimeout(push,2500)}
async function push(){if(!AUTH)return;clearTimeout(syncT);syncT=null;
 try{const L={};Object.keys(D.L||{}).forEach(k=>{L[k]=Object.assign({},D.L[k],{cards:undefined,cz:packCards(D.L[k].cards||{})})});const out=Object.assign({},D,{cards:undefined,cz:packCards(D.cards),L});const r=await api('save',{token:AUTH.token,data:out});if(r&&r.auth===false)logout(true)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&syncT)push()});
const INT=[1,3,7,14,30,60];
const today=()=>new Date().toISOString().slice(0,10);
function touch(){const t=today();if(D.last!==t){const y=new Date(Date.now()-DAY).toISOString().slice(0,10);D.streak=D.last===y?D.streak+1:1;D.last=t}save(D)}
function logout(expired){if(AUTH){const t=AUTH.token;if(!expired)api('logout',{token:t}).catch(()=>{})}
 AUTH=null;ldel(AKEY);D=blank();hubLogin()}

/* ================= เสียง ================= */
let voice=null;
function pickVoice(){const v=speechSynthesis.getVoices(),pre=LP.tts.slice(0,2);voice=v.find(x=>LP.ttsRe.test(x.lang)&&/Google|Samantha|Microsoft|Tingting|Kyoko|O-ren/i.test(x.name))||v.find(x=>LP.ttsRe.test(x.lang))||v.find(x=>x.lang.toLowerCase().startsWith(pre))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,rate){if(!('speechSynthesis' in window))return alertBox('เครื่องนี้ไม่รองรับเสียงอ่าน');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=LP.tts;if(voice)u.voice=voice;u.rate=rate||(CJK?0.8:0.9);speechSynthesis.speak(u)}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(onDone,onErr){if(!SR){onErr('เครื่องหรือเบราว์เซอร์นี้ยังไม่รองรับการฟังเสียงพูด แนะนำให้เปิดด้วย Chrome');return null}
 const r=new SR();r.lang=LP.tts;r.interimResults=false;r.maxAlternatives=5;
 r.onresult=e=>{const alts=[...e.results[0]].map(a=>({t:a.transcript.toLowerCase().trim(),c:a.confidence}));onDone(alts)};
 r.onerror=e=>onErr(e.error==='not-allowed'?'ใช้ไมโครโฟนไม่ได้: ถ้าเปิดจากหน้าตัวอย่างใน Claude ไมค์จะถูกปิดไว้ ต้องเปิดจากเว็บจริง (GitHub Pages) หรือถ้าเปิดจากเว็บจริงแล้ว ให้กดอนุญาตไมค์ที่เบราว์เซอร์':e.error==='no-speech'?'ไม่ได้ยินเสียง ลองพูดดังขึ้นอีกนิด':e.error==='language-not-supported'?'เครื่องนี้ยังฟังเสียงพูด'+LP.thName+'ไม่ได้ ลองเปิดด้วย Chrome':'ฟังเสียงไม่สำเร็จ ('+e.error+')');
 try{r.start()}catch(e){onErr('เริ่มไมค์ไม่ได้')}return r}
const kata2hira=s=>String(s).replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const normC=s=>kata2hira(String(s||'').toLowerCase()).replace(/[\s\u3000.,!?;:'"、。！？，．・「」（）()\-]/g,'');
let KJ=null;// ญี่ปุ่น: แปลงคำคันจิที่ระบบฟังได้ให้เป็นคานะ (จากคลังศัพท์) เพื่อเทียบกับคำอ่าน
function toKana(s){if(LANG!=='ja')return s;if(!KJ)KJ=ALL.filter(e=>e.kana&&/[\u3400-\u9fff]/.test(e.w)).map(e=>[e.w,e.kana.replace(/\s/g,'')]).sort((x,y)=>y[0].length-x[0].length);
 let o=String(s||'');for(const [w,k] of KJ)if(o.includes(w))o=o.split(w).join(k);return o}
function judge(alts,target,wrong){
 if(CJK){const i=info(target),tg=[target,i.kana].filter(Boolean).map(normC);const m=a=>tg.some(t=>t&&(normC(a.t).includes(t)||normC(toKana(a.t)).includes(t)));
  const hit=alts.find(m);if(hit){const sc=Math.round(60+40*(hit===alts[0]?(alts[0].c||0.8):0.5));return{ok:true,score:Math.min(sc,100),heard:alts[0].t}}
  const conf=wrong&&alts.find(a=>normC(a.t).includes(normC(wrong)));return{ok:false,score:conf?30:20,heard:alts[0]?alts[0].t:'',conf:!!conf}}
 target=target.toLowerCase();const w=s=>s.replace(/[^a-z ]/g,'').split(' ');
 const hit=alts.find(a=>w(a.t).join(' ')===target||w(a.t).includes(target));
 if(hit){const sc=Math.round(60+40*(hit===alts[0]?(alts[0].c||0.8):0.5));return{ok:true,score:Math.min(sc,100),heard:alts[0].t}}
 const conf=wrong&&alts.find(a=>w(a.t).includes(wrong.toLowerCase()));return{ok:false,score:conf?30:20,heard:alts[0]?alts[0].t:'',conf:!!conf}}

/* ================= หน้าจอ ================= */
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rdHTML=t=>esc(t).replace(/\{([^}]*)\}/g,'<span class="rx">$1</span>');
const rdPlain=t=>String(t||'').replace(/[{}]/g,'');
const pyw=w=>{if(!CJK)return '';const i=info(w),k=i.kana&&i.kana!==w?i.kana:'';const t=LANG==='zh'?i.py:k;return t?`<span class="py">${esc(t)}</span>`:''};
const rdw=w=>{const i=info(w);return (D.showRD&&i.rd)?`<span class="rd">${rdHTML(i.rd)}</span>`:''};
const trw=w=>{const i=info(w);return (D.showTH&&i.th)?`<span class="tr">${esc(i.th)}</span>`:''};
function soundOf(w){let i=SOUNDS.findIndex(x=>x.ex.includes(w));if(i<0)i=SOUNDS.findIndex(x=>x.pairs.some(p=>p[0]===w));if(i<0)i=SOUNDS.findIndex(x=>x.pairs.some(p=>p.includes(w)));
 if(i<0&&LP.soundFor){const id=LP.soundFor(info(w));i=SOUNDS.findIndex(x=>x.id===id)}return i}
const MIC='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>';
const BACK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
function alertBox(m){const n=document.createElement('div');n.className='note';n.textContent=m;app.prepend(n);setTimeout(()=>n.remove(),4000)}
function nav(v){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v))}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.go));
function go(v,arg){window.scrollTo(0,0);nav(v==='sound'?'sounds':v==='review'?'vocab':v);({home,sounds,sound,vocab,review,tips}[v])(arg)}
const bigW=w=>CJK?`<div class="cjk">${esc(w)}</div>`:`<div class="big">${esc(w)}</div>`;

function stats(lv){const C=P().cards;const ws=lv==null?ALL:inLv(lv);const learned=ws.filter(e=>(C[e.w]||{}).box>=2).length;const seen=ws.filter(e=>C[e.w]).length;
 const due=Object.keys(C).filter(w=>C[w].due<=Date.now()).length;
 const snd=Object.values(P().sounds).filter(s=>s.best>=70).length;return{learned,seen,due,snd}}
let LANG_OK=null; // รายการภาษาที่บัญชีนี้ใช้ได้ (มาจากศูนย์รวมงาน: แอดมินได้ทุกภาษา · สมาชิกต้องได้สิทธิ์ lang_zh / lang_ja)
try{const A=JSON.parse(localStorage.getItem('pea_hub_auth')||'null');if(A&&A.role!=='admin'&&Array.isArray(A.apps))LANG_OK=['en'].concat(A.apps.filter(x=>/^lang_/.test(x)).map(x=>x.slice(5)))}catch(e){}
const langAllowed=c=>c==='en'||!LANG_OK||LANG_OK.includes(c);
function langRow(){const ls=LANGS.filter(x=>langAllowed(x.code));if(ls.length<2)return '';
 return `<div class="row" role="group" aria-label="เลือกภาษา">${ls.map(x=>`<button class="lg ${x.code===LANG?'on':''}" data-lang="${x.code}">${esc(x.label)}</button>`).join('')}</div>`}
function switchLang(c){if(c===LANG)return;if(syncT)push();try{localStorage.setItem('langstep_lang',c)}catch(e){}location.href=location.pathname+'?lang='+c}

/* เส้นวรรณยุกต์จีน (มาตรา 1-5) */
const TONE=Object.assign({1:[[0,5],[1,5]],2:[[0,3],[1,5]],3:[[0,2],[.45,1],[1,4]],4:[[0,5],[1,1]],0:[[.3,3],[.7,2.6]]},LP.TONE||{});
const TNAME=Object.assign({1:'เสียง 1 สูงเรียบ',2:'เสียง 2 ขึ้น',3:'เสียง 3 ต่ำ',4:'เสียง 4 ลง',0:'เสียงเบา'},LP.TNAME||{});
function toneSVG(ts,prog){const W=300,H=130,n=ts.length,sw=(W-40)/n;let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="เส้นวรรณยุกต์">`;
 for(let k=1;k<=5;k++){const y=10+(5-k)*25;g+=`<line x1="30" y1="${y}" x2="${W-6}" y2="${y}" stroke="#E3E7F1" stroke-width="1"/><text x="10" y="${y+4}" font-size="11" fill="#4A5470">${k}</text>`}
 ts.forEach((t,i)=>{const pts=TONE[t]||TONE[1],x0=34+i*sw,x1=x0+sw-14;const p=Math.max(0,Math.min(1,prog*n-i));if(p<=0)return;
  const xy=pts.map(([a,b])=>[x0+(x1-x0)*a,10+(5-b)*25]);let d='',acc=[];
  // ตัดเส้นตามความคืบหน้า
  const segs=[];let L=0;for(let k=1;k<xy.length;k++){const l=Math.hypot(xy[k][0]-xy[k-1][0],xy[k][1]-xy[k-1][1]);segs.push(l);L+=l}
  let left=L*p;acc.push(xy[0]);for(let k=1;k<xy.length&&left>0;k++){const l=segs[k-1];if(left>=l){acc.push(xy[k]);left-=l}else{const r=left/l;acc.push([xy[k-1][0]+(xy[k][0]-xy[k-1][0])*r,xy[k-1][1]+(xy[k][1]-xy[k-1][1])*r]);left=0}}
  d=acc.map((q,k)=>(k?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');const e=acc[acc.length-1];
  g+=`<path d="${d}" fill="none" stroke="${t===0?'#F0997B':'#D85A30'}" stroke-width="${t===0?5:6}" stroke-linecap="round" stroke-linejoin="round"/>`;if(p<1)g+=`<circle cx="${e[0]}" cy="${e[1]}" r="8" fill="#B85A12"/>`});
 return g+'</svg>'}

  async function playT(slow){const id=++run;hi(0);cap(dm.tone.map(t=>TNAME[t]).join(' + '),dm.w);say(dm.w,slow?0.5:0.8);hi(1);await anim(dm.tone,(slow?1500:850)*dm.tone.length,id);if(id===run)hi(2)}

  $('#pl').onclick=()=>playT(false);$('#ps').onclick=()=>playT(true);if($('#pc'))$('#pc').onclick=cmpT;

 function move(to,ms,id){const from=cur;return new Promise(res=>{const t0=performance.now();
  const f=now=>{if(id!==run||!live())return res(false);let t=Math.min(1,(now-t0)/ms);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;draw(MO.lerp(from,to,e));
   if(t<1)requestAnimationFrame(f);else{cur=to;res(true)}};requestAnimationFrame(f)})}

  cap('ท่าปกติ');hi(0);draw(cur=MO.REST);await wait(300*k);

 $('#pd').onchange=e=>{Pr.perDay=+e.target.value;save(D)};
 app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const ci=+b.dataset.cat,box=$('#cw'+ci);if(!box.hidden){box.hidden=true;return}
  if(!box.innerHTML)box.innerHTML=ws.filter(e=>e.cat===cats[ci]).map(e=>{const bx=(C[e.w]||{}).box;const col=bx>=2?'#D2F0EA':bx!==undefined?'#FCE3CC':'#EEF0F5';return `<button class="soft w2" style="background:${col};border:none;color:#16213E" data-say="${esc(e.w)}"><span style="font-weight:600${CJK?';font-size:20px':''}">${esc(e.w)}</span>${pyw(e.w)}${D.showRD&&e.rd?`<span class="rd">${rdHTML(e.rd)}</span>`:''}${D.showTH?`<span class="tr">${esc(e.th)}</span>`:''}</button>`}).join('');
  box.hidden=false;box.querySelectorAll('[data-say]').forEach(x=>x.onclick=()=>say(x.dataset.say))});
 $('#st').onclick=()=>go('review')}

function review(){const Pr=P(),C=Pr.cards,t=today();if(Pr.newDay!==t){Pr.newDay=t;Pr.newToday=0}
 if(!allReady){app.innerHTML='<div class="mut">กำลังโหลดคำศัพท์…</div>';loadAll().then(()=>{allReady=true;go('review')});return}
 const lv=Pr.lv||0,per=Pr.perDay||10;
 const due=Object.keys(C).filter(w=>C[w].due<=Date.now()&&BYW[w]).map(w=>BYW[w]);
 const fresh=inLv(lv).filter(e=>!C[e.w]).slice(0,Math.max(0,per-Pr.newToday));
 let queue=[...due,...fresh],done=0,total=queue.length;
 if(!total){const left=inLv(lv).filter(e=>!C[e.w]).length;app.innerHTML=`<h1>ทบทวนครบแล้ว</h1><div class="okn">${left?`วันนี้ไม่มีคำค้างทบทวน และเรียนคำใหม่ครบ ${per} คำแล้ว กลับมาพรุ่งนี้นะครับ`:`เรียนคำใน Level ${lv} ครบทุกคำแล้ว ไปที่คลังศัพท์แล้วเลือก Level ถัดไปได้เลย`}</div><button class="btn" id="h">กลับหน้าหลัก</button>`;$('#h').onclick=()=>go('home');return}
 function show(){if(!queue.length){touch();app.innerHTML=`<h1>เสร็จแล้ว</h1><div class="okn">ทบทวนครบ ${total} คำ</div><button class="btn" id="h">กลับหน้าหลัก</button>`;$('#h').onclick=()=>go('home');return}
  const v=queue[0],isNew=!C[v.w];let flipped=false,rec=null;
  app.innerHTML=`<div class="row" style="align-items:center"><button class="back" id="bk" aria-label="กลับ">${BACK}</button><div style="flex:1"><div class="mut">${done}/${total} ${isNew?'· คำใหม่':'· ทบทวน'} · Level ${v.lv} · ${esc(v.cat)}</div><div class="bar"><i style="width:${done/total*100}%"></i></div></div></div>
  <button class="card" id="fc" style="min-height:230px;text-align:left;font:inherit;color:inherit;cursor:pointer">${bigW(v.w)}<div id="bk2" class="mut">แตะเพื่อดู${CJK?'คำอ่านและ':''}ความหมาย</div></button>
  <div class="row"><button class="soft" id="hear">ฟังเสียง</button><button class="soft" id="slow">ฟังช้า</button><button class="soft" id="spk">ลองพูด</button></div><div id="sres"></div>
  <div class="g3" id="rate" style="visibility:hidden"><button style="border:none;background:#F7D6D6;color:#7A1F1F;font-weight:700" data-r="0">ลืม<br><small>ทวนอีกรอบ</small></button><button style="border:none;background:#FCE3CC;color:#5E2C05;font-weight:700" data-r="1">พอจำได้</button><button style="border:none;background:#D2F0EA;color:#0B5E54;font-weight:700" data-r="2">จำได้ดี</button></div>`;
  say(v.w);$('#bk').onclick=()=>go('vocab');$('#hear').onclick=()=>say(v.w);$('#slow').onclick=()=>say(v.w,0.55);
  $('#fc').onclick=()=>{if(flipped)return;flipped=true;const si=soundOf(v.w),sr=CJK?v.srd:(v.srd||autoRead(v.ex));
   const ruby=CJK?`<div class="py" style="font-size:18px">${esc(LANG==='zh'?v.py:(v.kana&&v.kana!==v.w?v.kana:''))}</div>`:'';
   const exr=CJK&&v.expy?`<div class="py" style="font-weight:400">${esc(v.expy)}</div>`:'';
   $('#bk2').outerHTML=`${ruby}${D.showRD&&v.rd?`<div class="rd" style="font-size:16px">${rdHTML(v.rd)}</div>`:''}<div style="font-size:22px;font-weight:700">${esc(v.th)}</div><div style="font-weight:600${CJK?';font-size:19px':''}">${esc(v.ex)}</div>${exr}${D.showRD&&sr?`<div class="rd" style="font-size:15px">${rdHTML(sr)}</div>`:''}<div class="trs">${esc(v.exth)}</div>${D.showRD&&v.note?`<div class="tip2">${CJK?'หมายเหตุ':'ภาษาพูด'}: ${esc(v.note)}</div>`:''}${si>=0?`<span class="soft" id="toSnd" role="button" tabindex="0" style="display:inline-flex;align-items:center;align-self:flex-start;margin-top:4px">${CJK?'ฝึกบทเสียงนี้':'ดูภาพปากเสียงนี้'}</span>`:''}`;
   const ts=$('#toSnd');if(ts)ts.onclick=e=>{e.stopPropagation();go('sound',si)};$('#rate').style.visibility='visible';say(v.ex,0.85)};
  $('#spk').onclick=()=>{if(rec)return;$('#sres').innerHTML='<div class="mut">กำลังฟัง… พูดได้เลย</div>';rec=listen(a=>{rec=null;const r=judge(a,v.w);$('#sres').innerHTML=`<div class="${r.ok?'okn':'note'}">${r.ok?'พูดถูก':'ระบบได้ยินว่า “'+esc(r.heard||'-')+'” ลองใหม่'}</div>`},e=>{rec=null;$('#sres').innerHTML=`<div class="note">${esc(e)}</div>`})};
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=+b.dataset.r,c=C[v.w]||{box:0};if(isNew)Pr.newToday++;
   if(r===0){c.box=0;c.due=Date.now();queue.push(queue.shift());C[v.w]=c;save(D);show();return}
   c.box=Math.min(r===2?c.box+1:Math.max(c.box,1),INT.length);c.due=Date.now()+INT[Math.max(c.box-1,0)]*DAY;C[v.w]=c;queue.shift();done++;save(D);show()})}
 show()}

function tips(){app.innerHTML=`<h1>เทคนิคจำศัพท์${CJK?' · '+esc(LP.thName):''}</h1><div class="mut">อ่านวันละ 1 เรื่อง แล้วลองใช้กับคำศัพท์วันนั้น</div>`+
 TIPS.map((t,i)=>`<div class="card"><h2>${i+1}. ${esc(t[0])}</h2><div>${esc(t[1])}</div></div>`).join('')}

function hubCreds(){try{return{name:localStorage.getItem('pea_aoluek_username')||'',pass:localStorage.getItem('pea_aoluek_password')||''}}catch(e){return{name:'',pass:''}}}
function authBox(msg,err){$('#nav').style.display='none';window.scrollTo(0,0);
 app.innerHTML=`<div style="padding-top:24px"><div class="mut">${esc(LP.label)} Step</div><h1 style="font-size:26px">เข้าสู่ระบบ</h1><div class="mut">ใช้บัญชีเดียวกับศูนย์รวมงาน กฟส.อ่าวลึก</div></div>
 <div class="card"><div class="${err?'note':'mut'}">${esc(msg)}</div>${err?'<button class="btn" id="rt">ลองใหม่</button>':''}<a class="soft" href="/index.html" style="display:flex;align-items:center;justify-content:center;text-decoration:none">ไปหน้าศูนย์รวมงาน</a></div>`;
 if(err)$('#rt').onclick=hubLogin}
let hubWait=null;
async function hubLogin(){clearTimeout(hubWait);const c=hubCreds();
 if(!c.name||!c.pass){authBox('รอเข้าสู่ระบบศูนย์รวมงาน…');hubWait=setTimeout(hubLogin,1500);return}
 authBox('กำลังตรวจสอบสิทธิ์กับศูนย์รวมงาน…');
 try{const r=await api('hubAuth',{name:c.name,pass:c.pass});
  if(!r.ok){if(r.auth===false){hubWait=setTimeout(hubLogin,3000)}authBox(r.msg||'เข้าสู่ระบบไม่สำเร็จ',true);return}
  AUTH={token:r.token,user:r.user,hubName:c.name};lset(AKEY,AUTH);
  const local=lget(dkey());if(r.data)useData(r.data);else{useData(local);push()}
  lset(dkey(),D);start()}
 catch(e){authBox('เชื่อมต่อระบบไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่',true)}}
function start(){$('#nav').style.display='';go('home')}
if(AUTH&&AUTH.hubName&&AUTH.hubName===hubCreds().name){useData(lget(dkey()));start();
 api('load',{token:AUTH.token}).then(r=>{if(r.auth===false)return logout(true);if(r.ok){AUTH.user=r.user;lset(AKEY,AUTH);if(r.data){useData(r.data);lset(dkey(),D)}else push();if(!$('#fc'))go('home')}}).catch(()=>{})}
else{AUTH=null;ldel(AKEY);hubLogin()}
</script>
